name: Publish Production Database

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (leave empty to auto-increment)'
        required: false
        default: ''
      branch:
        description: 'Database branch to export from'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - dev

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y sqlcipher
          npm install

      - name: Determine version
        id: version
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          else
            CURRENT=$(cat version.json 2>/dev/null | grep -o '"version": "[^"]*"' | cut -d'"' -f4 || echo "2.57")
            MAJOR=$(echo $CURRENT | cut -d. -f1)
            MINOR=$(echo $CURRENT | cut -d. -f2)
            [ -z "$MINOR" ] && MINOR=57
            VERSION="${MAJOR}.$((MINOR + 1))"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Set credentials
        run: |
          BRANCH="${{ github.event.inputs.branch || 'production' }}"
          if [ "$BRANCH" = "dev" ]; then
            echo "TURSO_URL=${{ secrets.TURSO_DEV_URL }}" >> $GITHUB_ENV
            echo "TURSO_TOKEN=${{ secrets.TURSO_DEV_TOKEN }}" >> $GITHUB_ENV
          else
            echo "TURSO_URL=${{ secrets.TURSO_URL }}" >> $GITHUB_ENV
            echo "TURSO_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}" >> $GITHUB_ENV
          fi
          echo "DB_BRANCH=${BRANCH}" >> $GITHUB_ENV
          echo "DB_VERSION=${{ steps.version.outputs.VERSION }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=Mimalif@110" >> $GITHUB_ENV

      - name: Generate databases
        run: node generate-dbs.mjs

      - name: Commit to releases/
        run: |
          rm -f releases/*.sqlite
          cp release_files/*.sqlite releases/
          echo "{\"version\": \"${DB_VERSION}\"}" > version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/ version.json
          git diff --cached --quiet || git commit -m "chore(release): v${DB_VERSION} [bot]"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DB_VERSION }}
          name: "Release v${{ env.DB_VERSION }}"
          prerelease: false
          body: |
            **Branch:** ${{ env.DB_BRANCH }}

            Files: `database.sqlite` + `database_{lang}.sqlite`
          files: release_files/*
