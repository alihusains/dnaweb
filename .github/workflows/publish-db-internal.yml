name: Publish Internal Database (Pre-release)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.1)'
        required: true
      branch:
        description: 'Database branch to export from'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - dev

permissions:
  contents: write

jobs:
  publish-internal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlcipher
          npm install @libsql/client better-sqlite3

      - name: Set database credentials
        run: |
          BRANCH="${{ github.event.inputs.branch || 'production' }}"
          if [ "$BRANCH" = "dev" ]; then
            echo "TURSO_URL=${{ secrets.TURSO_DEV_URL }}" >> $GITHUB_ENV
            echo "TURSO_TOKEN=${{ secrets.TURSO_DEV_TOKEN }}" >> $GITHUB_ENV
          else
            echo "TURSO_URL=${{ secrets.TURSO_URL }}" >> $GITHUB_ENV
            echo "TURSO_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}" >> $GITHUB_ENV
          fi
          echo "DB_BRANCH=${BRANCH}" >> $GITHUB_ENV
          echo "DB_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=Mimalif@110" >> $GITHUB_ENV

      - name: Generate all database files
        run: |
          cat << 'SCRIPT' > generate-dbs.mjs
          import { createClient } from '@libsql/client';
          import Database from 'better-sqlite3';
          import { execSync } from 'child_process';
          import fs from 'fs';

          const VERSION = process.env.DB_VERSION;
          const BRANCH = process.env.DB_BRANCH;
          const PASSWORD = process.env.DB_PASSWORD;
          const OUTPUT_DIR = 'release_files';

          // Create output directory
          if (fs.existsSync(OUTPUT_DIR)) fs.rmSync(OUTPUT_DIR, { recursive: true });
          fs.mkdirSync(OUTPUT_DIR, { recursive: true });

          async function main() {
            const turso = createClient({
              url: process.env.TURSO_URL,
              authToken: process.env.TURSO_TOKEN
            });

            console.log(`Generating internal release v${VERSION} from ${BRANCH} branch`);

            // 1. Fetch all data from Turso
            console.log('\n--- Fetching data from Turso ---');
            const tables = ['languages', 'categories', 'item_translations'];
            const data = {};

            for (const table of tables) {
              const result = await turso.execute(`SELECT * FROM ${table}`);
              data[table] = result.rows;
              console.log(`  ${table}: ${result.rows.length} rows`);
            }

            // Also fetch legacy_bookmark_map if it exists
            try {
              const bmResult = await turso.execute('SELECT * FROM legacy_bookmark_map');
              data['legacy_bookmark_map'] = bmResult.rows;
              console.log(`  legacy_bookmark_map: ${bmResult.rows.length} rows`);
            } catch (e) {
              console.log('  legacy_bookmark_map: not found, skipping');
            }

            // 2. Generate full database (all languages)
            console.log('\n--- Generating full database ---');
            const fullDbPath = `${OUTPUT_DIR}/database.sqlite`;
            createFullDb(fullDbPath, data);
            encryptAndVerify(fullDbPath, PASSWORD);
            console.log(`  database.sqlite: ${(fs.statSync(fullDbPath).size / 1024).toFixed(1)} KB`);

            // 3. Get languages and generate per-language databases
            const languages = data.languages;
            console.log(`\n--- Generating per-language databases (${languages.length} languages) ---`);

            for (const lang of languages) {
              const langFile = `${OUTPUT_DIR}/database_${lang.code}.sqlite`;
              console.log(`\n  Generating database_${lang.code}.sqlite (${lang.name})...`);
              createLanguageDb(langFile, lang.code, data);
              encryptAndVerify(langFile, PASSWORD);
              console.log(`  database_${lang.code}.sqlite: ${(fs.statSync(langFile).size / 1024).toFixed(1)} KB`);
            }

            console.log('\n--- All files generated ---');
            const files = fs.readdirSync(OUTPUT_DIR);
            for (const f of files) {
              const size = fs.statSync(`${OUTPUT_DIR}/${f}`).size;
              console.log(`  ${f} (${(size / 1024).toFixed(1)} KB)`);
            }
          }

          function createFullDb(outputPath, data) {
            const db = new Database(outputPath);
            db.pragma('journal_mode = WAL');

            db.exec(`
              CREATE TABLE IF NOT EXISTS languages (
                id INTEGER PRIMARY KEY, code TEXT NOT NULL, name TEXT NOT NULL, is_rtl INTEGER DEFAULT 0
              );
              CREATE TABLE IF NOT EXISTS categories (
                id INTEGER PRIMARY KEY, parent_id INTEGER, sequence INTEGER DEFAULT 0,
                lang_name TEXT, english_name TEXT, audio_url TEXT, video_url TEXT, duas_url TEXT,
                local_audio_url TEXT, local_video_url TEXT, is_trans INTEGER DEFAULT 0,
                related1 INTEGER, related2 INTEGER, notify_hijri_date TEXT, label1 TEXT, label2 TEXT,
                is_last_level INTEGER DEFAULT 0, language_code TEXT DEFAULT 'gu', content_source_id INTEGER
              );
              CREATE TABLE IF NOT EXISTS item_translations (
                id INTEGER PRIMARY KEY, category_id INTEGER NOT NULL, sequence INTEGER DEFAULT 0,
                language_title TEXT, arabic TEXT, translation TEXT, transliteration TEXT,
                is_visible INTEGER DEFAULT 1, english TEXT
              );
              CREATE INDEX IF NOT EXISTS idx_categories_english_name ON categories(english_name);
              CREATE INDEX IF NOT EXISTS idx_categories_parent ON categories(parent_id);
              CREATE INDEX IF NOT EXISTS idx_categories_sequence ON categories(sequence);
              CREATE INDEX IF NOT EXISTS idx_categories_language_code ON categories(language_code);
              CREATE INDEX IF NOT EXISTS idx_item_translations_category ON item_translations(category_id);
            `);

            // Insert data
            insertTable(db, 'languages', data.languages);
            insertTable(db, 'categories', data.categories);
            insertTable(db, 'item_translations', data.item_translations);

            if (data.legacy_bookmark_map) {
              db.exec(`
                CREATE TABLE IF NOT EXISTS legacy_bookmark_map (
                  source_table TEXT NOT NULL, legacy_id INTEGER NOT NULL,
                  new_category_id INTEGER, new_item_id INTEGER, legacy_title TEXT,
                  PRIMARY KEY (source_table, legacy_id)
                );
                CREATE INDEX IF NOT EXISTS idx_bookmark_new_item ON legacy_bookmark_map(new_item_id);
                CREATE INDEX IF NOT EXISTS idx_bookmark_new_cat ON legacy_bookmark_map(new_category_id);
              `);
              insertTable(db, 'legacy_bookmark_map', data.legacy_bookmark_map);
            }

            db.close();
          }

          function createLanguageDb(outputPath, langCode, data) {
            const db = new Database(outputPath);
            db.pragma('journal_mode = WAL');

            db.exec(`
              CREATE TABLE IF NOT EXISTS languages (
                id INTEGER PRIMARY KEY, code TEXT NOT NULL, name TEXT NOT NULL, is_rtl INTEGER DEFAULT 0
              );
              CREATE TABLE IF NOT EXISTS categories (
                id INTEGER PRIMARY KEY, parent_id INTEGER, sequence INTEGER DEFAULT 0,
                lang_name TEXT, english_name TEXT, audio_url TEXT, video_url TEXT, duas_url TEXT,
                local_audio_url TEXT, local_video_url TEXT, is_trans INTEGER DEFAULT 0,
                related1 INTEGER, related2 INTEGER, notify_hijri_date TEXT, label1 TEXT, label2 TEXT,
                is_last_level INTEGER DEFAULT 0, language_code TEXT DEFAULT 'gu', content_source_id INTEGER
              );
              CREATE TABLE IF NOT EXISTS item_translations (
                id INTEGER PRIMARY KEY, category_id INTEGER NOT NULL, sequence INTEGER DEFAULT 0,
                language_title TEXT, arabic TEXT, translation TEXT, transliteration TEXT,
                is_visible INTEGER DEFAULT 1, english TEXT
              );
              CREATE INDEX IF NOT EXISTS idx_categories_english_name ON categories(english_name);
              CREATE INDEX IF NOT EXISTS idx_categories_parent ON categories(parent_id);
              CREATE INDEX IF NOT EXISTS idx_categories_sequence ON categories(sequence);
              CREATE INDEX IF NOT EXISTS idx_categories_language_code ON categories(language_code);
              CREATE INDEX IF NOT EXISTS idx_item_translations_category ON item_translations(category_id);
            `);

            // Insert language row
            const lang = data.languages.find(l => l.code === langCode);
            if (lang) {
              db.prepare('INSERT INTO languages (id, code, name, is_rtl) VALUES (?, ?, ?, ?)').run(
                lang.id, lang.code, lang.name, lang.is_rtl
              );
            }

            // Get categories for this language
            const langCatIds = new Set(
              data.categories.filter(c => c.language_code === langCode).map(c => c.id)
            );

            if (langCatIds.size === 0) {
              console.log(`    No categories found for ${langCode}`);
              db.close();
              fs.unlinkSync(outputPath);
              return;
            }

            // Walk parent chain in-memory
            const catMap = new Map(data.categories.map(c => [c.id, c]));
            const allNeededIds = new Set(langCatIds);
            for (const catId of langCatIds) {
              let current = catId;
              while (current) {
                const cat = catMap.get(current);
                if (cat && cat.parent_id && !allNeededIds.has(cat.parent_id)) {
                  allNeededIds.add(cat.parent_id);
                  current = cat.parent_id;
                } else {
                  break;
                }
              }
            }

            // Insert categories
            const categories = data.categories.filter(c => allNeededIds.has(c.id));
            for (const cat of categories) {
              db.prepare(`
                INSERT INTO categories (id, parent_id, sequence, lang_name, english_name,
                  audio_url, video_url, duas_url, local_audio_url, local_video_url,
                  is_trans, related1, related2, notify_hijri_date, label1, label2,
                  is_last_level, language_code, content_source_id)
                VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
              `).run(
                cat.id, cat.parent_id, cat.sequence, cat.lang_name, cat.english_name,
                cat.audio_url, cat.video_url, cat.duas_url, cat.local_audio_url, cat.local_video_url,
                cat.is_trans, cat.related1, cat.related2, cat.notify_hijri_date, cat.label1, cat.label2,
                cat.is_last_level, cat.language_code, cat.content_source_id
              );
            }

            // Insert item_translations
            const items = data.item_translations.filter(i => allNeededIds.has(i.category_id));
            for (const item of items) {
              db.prepare(`
                INSERT INTO item_translations (id, category_id, sequence, language_title,
                  arabic, translation, transliteration, is_visible, english)
                VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)
              `).run(
                item.id, item.category_id, item.sequence, item.language_title,
                item.arabic, item.translation, item.transliteration, item.is_visible, item.english
              );
            }

            console.log(`    ${categories.length} categories, ${items.length} items`);
            db.close();
          }

          function insertTable(db, tableName, rows) {
            if (!rows || rows.length === 0) return;
            const columns = Object.keys(rows[0]);
            const placeholders = columns.map(() => '?').join(',');
            const stmt = db.prepare(`INSERT INTO ${tableName} (${columns.join(',')}) VALUES (${placeholders})`);
            const insertMany = db.transaction((items) => {
              for (const row of items) {
                stmt.run(columns.map(col => row[col] ?? null));
              }
            });
            insertMany(rows);
          }

          function encryptAndVerify(filePath, password) {
            const tempFile = `${filePath}.tmp`;
            fs.renameSync(filePath, tempFile);

            execSync(`sqlcipher ${tempFile} "ATTACH DATABASE '${filePath}' AS encrypted KEY '${password}'; SELECT sqlcipher_export('encrypted'); DETACH DATABASE encrypted;"`);
            fs.unlinkSync(tempFile);

            // Verify
            try {
              execSync(`sqlcipher ${filePath} "PRAGMA key = '${password}'; SELECT count(*) FROM sqlite_master;"`, { stdio: 'pipe' });
            } catch (e) {
              throw new Error(`Encryption verification failed for ${filePath}: ${e.message}`);
            }
          }

          main().catch(err => {
            console.error('Error:', err.message);
            process.exit(1);
          });
          SCRIPT

      - name: Run database generation
        run: node generate-dbs.mjs

      - name: Update version.json
        run: |
          echo "{\"version\": \"${DB_VERSION}\", \"channel\": \"internal\"}" > version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update internal database version to ${DB_VERSION} [bot]" || echo "No changes"
          git push

      - name: Create Internal Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DB_VERSION }}-internal
          name: "Internal Release v${{ env.DB_VERSION }}"
          prerelease: true
          body: |
            ## Internal Pre-release v${{ env.DB_VERSION }}

            **Branch:** ${{ env.DB_BRANCH }}

            ### Files included:
            - `database.sqlite` — Full database (all languages)
            - `database_{lang}.sqlite` — Per-language databases

            > This is an internal pre-release for testing. Do not distribute to end users.
          files: |
            release_files/*

      - name: Update latest-internal tag
        run: |
          git tag -f latest-internal
          git push -f origin latest-internal
